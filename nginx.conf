server { listen 80; server_name _; root /usr/share/nginx/html; charset utf-8; location = /health { default_type text/plain; try_files /health =503; } location / { try_files $uri $uri/index.html $uri/ =404; } add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ { expires 5m; add_header Cache-Control "public, max-age=300, must-revalidate"; try_files $uri =404; } }
